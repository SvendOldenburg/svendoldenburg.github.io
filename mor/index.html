<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mors Liste</title>
<meta name="description" content="Tingene i lejligheden, som skal fikses -- live kopi af FIKS DET.">
<meta name="theme-color" content="#F7F5F1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5F1;
    --surface: #FFFFFF;
    --ink: #1E2530;
    --ink-soft: #5B6472;
    --border: #E7EAF0;
    --cobalt: #0047AB;
    --sage: #4F8A6D;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171D;
      --surface: #1C2029;
      --ink: #ECEDF0;
      --ink-soft: #9AA2B1;
      --border: #2C3140;
      --cobalt: #5B8FE0;
      --sage: #7EC29A;
    }
  }

  :root[data-theme="dark"] {
    --bg: #14171D;
    --surface: #1C2029;
    --ink: #ECEDF0;
    --ink-soft: #9AA2B1;
    --border: #2C3140;
    --cobalt: #5B8FE0;
    --sage: #7EC29A;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: clamp(20px, 5vw, 64px) 20px 64px;
  }

  main {
    width: 100%;
    max-width: 620px;
  }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
  }

  .title-block h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: clamp(28px, 5vw, 36px);
    line-height: 1.1;
    margin: 0;
  }
  .title-block .heart { color: var(--cobalt); }

  .title-block p {
    margin: 6px 0 0;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .live-tag {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    padding: 7px 12px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .live-tag .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--sage);
    flex-shrink: 0;
  }
  .live-tag.is-stale .live-dot { background: #C0524A; }

  .stats {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
  }

  .stat {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }

  .stat .num {
    font-family: 'Fraunces', Georgia, serif;
    font-variant-numeric: tabular-nums;
    font-size: 26px;
    font-weight: 600;
    line-height: 1;
  }

  .stat.open .num { color: var(--cobalt); }
  .stat.done .num { color: var(--sage); }

  .stat .label {
    color: var(--ink-soft);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 4px;
  }

  section.group { margin-bottom: 28px; }

  .group-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin: 0 0 10px 2px;
  }

  ul.tasks {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .task {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }

  .task .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    margin-top: 6px;
    flex-shrink: 0;
    background: var(--cobalt);
  }
  .task.is-done .dot { background: var(--sage); }

  .task .body { min-width: 0; flex: 1; }

  .task .title {
    font-weight: 600;
    font-size: 15px;
    line-height: 1.4;
  }
  .task.is-done .title {
    color: var(--ink-soft);
    text-decoration: line-through;
    text-decoration-color: var(--border);
    text-decoration-thickness: 1.5px;
  }

  .task .note {
    color: var(--ink-soft);
    font-size: 13.5px;
    line-height: 1.5;
    margin-top: 4px;
  }

  .task .date {
    color: var(--ink-soft);
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    margin-top: 6px;
    opacity: 0.8;
  }

  .task.is-done .date::after { content: " · klaret"; }

  .empty, .error, .loading {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px 20px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .error { color: #C0524A; border-color: #E8B9B4; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .error { color: #E8837A; border-color: #4A2E2C; }
  }
  :root[data-theme="dark"] .error { color: #E8837A; border-color: #4A2E2C; }

  footer {
    margin-top: 32px;
    text-align: center;
    font-size: 11.5px;
    color: var(--ink-soft);
    opacity: 0.7;
  }
</style>
</head>
<body>

<main>
  <header>
    <div class="title-block">
      <h1><span class="heart">&#9829;</span> Mors Liste</h1>
      <p>Tingene i lejligheden, som skal fikses</p>
    </div>
    <div class="live-tag" id="live-tag">
      <span class="live-dot"></span>
      <span id="live-label">Henter...</span>
    </div>
  </header>

  <div class="stats">
    <div class="stat open">
      <div class="num" id="open-count">&ndash;</div>
      <div class="label">P&aring; listen</div>
    </div>
    <div class="stat done">
      <div class="num" id="done-count">&ndash;</div>
      <div class="label">Klaret</div>
    </div>
  </div>

  <div id="content">
    <div class="loading">Henter listen&hellip;</div>
  </div>

  <footer>Live kopi af FIKS DET &middot; opdateres hver gang siden loades</footer>
</main>

<script>
  // Read-only mirror of FIKS DET's fiksdet_tasks collection. No login, by
  // design (matches the FIKS DET app itself) -- this unlisted URL is the
  // access control. Always fetches live: no snapshot, no cache, no cron.
  const PB = 'https://pb.aetheriumforge.cloud';
  const COLLECTION = 'fiksdet_tasks';

  function timeAgo(dateStr) {
    // PocketBase timestamps are UTC without a trailing Z; normalize before parsing.
    const iso = dateStr.includes('Z') ? dateStr : dateStr.replace(' ', 'T') + 'Z';
    const d = new Date(iso);
    const diffMs = Date.now() - d.getTime();
    const days = Math.floor(diffMs / 86400000);
    if (days <= 0) return 'i dag';
    if (days === 1) return 'i går';
    if (days < 14) return days + ' dage siden';
    const weeks = Math.floor(days / 7);
    if (weeks < 8) return weeks + ' uger siden';
    return d.toLocaleDateString('da-DK', { day: 'numeric', month: 'short' });
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function renderTask(t) {
    const note = t.note && t.note.trim()
      ? `<div class="note">${escapeHtml(t.note)}</div>`
      : '';
    return `
      <li class="task ${t.done ? 'is-done' : ''}">
        <span class="dot"></span>
        <div class="body">
          <div class="title">${escapeHtml(t.title)}</div>
          ${note}
          <div class="date">${timeAgo(t.created)}</div>
        </div>
      </li>`;
  }

  function renderGroup(label, items) {
    if (!items.length) return '';
    return `
      <section class="group">
        <div class="group-label">${label}</div>
        <ul class="tasks">${items.map(renderTask).join('')}</ul>
      </section>`;
  }

  function render(tasks) {
    const content = document.getElementById('content');
    const items = [...tasks].sort((a, b) => new Date(b.created) - new Date(a.created));
    const open = items.filter(t => !t.done);
    const done = items.filter(t => t.done);

    document.getElementById('open-count').textContent = open.length;
    document.getElementById('done-count').textContent = done.length;

    if (!items.length) {
      content.innerHTML = '<div class="empty">Listen er tom lige nu.</div>';
      return;
    }

    content.innerHTML =
      renderGroup('På listen', open) +
      renderGroup('Klaret', done);
  }

  function setLiveTag(ok) {
    const tag = document.getElementById('live-tag');
    const label = document.getElementById('live-label');
    tag.classList.toggle('is-stale', !ok);
    label.textContent = ok ? 'Live' : 'Kunne ikke opdatere';
  }

  async function load() {
    try {
      const res = await fetch(`${PB}/api/collections/${COLLECTION}/records?perPage=500`);
      if (!res.ok) throw new Error(`PB ${res.status}`);
      const data = await res.json();
      const tasks = data.items.filter(t => !t.deleted);
      render(tasks);
      setLiveTag(true);
    } catch (err) {
      document.getElementById('content').innerHTML =
        '<div class="error">Listen kunne ikke hentes lige nu. Pr&oslash;v at genindl&aelig;se siden.</div>';
      setLiveTag(false);
    }
  }

  load();
</script>

</body>
</html>
